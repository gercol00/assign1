<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSCE 41333 Cloud Application Development</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">

    <style>
        #box {
            display: inline;
            font-size: small;
            margin: 5px;
        }
    </style>
</head>

<body>

    <!-- Image and text -->
    <nav class="navbar navbar-light bg-light" style="margin-bottom: 20px">
        <a class="navbar-brand p-2 mb-2" href="/">
            CSCE 41333 Cloud App Development Simple SPA
        </a>
    </nav>
    
    <h3>Add New User</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="text" id="firstname" placeholder="First Name">
    <input type="text" id="lastname" placeholder="Last Name">
    <input type="password" id="passwd" placeholder="Password">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="urole" placeholder="Role">
    <button id="adduser">Add User</button>

    <br><br>

    <h3>Users</h3>

    <div class="container">
        <div class="col">
            <button id="refresh" class="btn btn-primary">Refresh Users</button>
            <div id="box"></div>
            <table id="usertable" class="table table-bordered table-striped">

            </table>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"
        integrity="sha384-q2kxQ16AaE6UbzuKqyBE9/u/KzioAlnx2maXQHiDX9d4/zp8Ok3f+M7DPm+Ib6IU"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.min.js"
        integrity="sha384-pQQkAEnwaBkjpqZ8RU1fF1AKtTcHJwFl3pblpTlHXybJjHpMYo79HY3hIi4NKxyj"
        crossorigin="anonymous"></script>
    <script src="users.js"></script>
</body>

</html>
